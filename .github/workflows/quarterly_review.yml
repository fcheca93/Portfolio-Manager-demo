name: Quarterly Review

on:
  schedule:
    - cron: '0 12 * * 1-5'
  workflow_dispatch:

jobs:
  quarterly-review:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        portfolio: [frontier5_v2, defense_aerospace]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Quarterly Review — ${{ matrix.portfolio }}
        env:
          PORTFOLIO_ID:      ${{ matrix.portfolio }}
          FINNHUB_API_KEY:   ${{ secrets.FINNHUB_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:  ${{ secrets.TELEGRAM_CHAT_ID }}
          MANUAL_TRIGGER:    ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: python quarterly_review.py
